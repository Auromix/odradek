name: Concept feedback / 概念反馈
description: Discuss luminous fingers, circular LED states, arm form, or grasp behavior.
title: "[Concept] "
body:
  - type: dropdown
    id: candidate
    attributes:
      label: Candidate / 候选
      options:
        - R1 D2 two fingers
        - R1 D3 three fingers
        - R1 D4 four fingers
        - R1 circular LED display and lighting
        - R1 grasp and expression behavior
        - R0 A FIELD (historical)
        - R0 B FRAME (historical)
        - R0 C SHELL (historical)
        - R0 attention study (historical)
        - Shared architecture
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Observation / 观察
      description: Identify the image, pose, and practical or visual issue.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal and evidence / 建议与依据
      description: Distinguish design preference, engineering hypothesis, and test evidence.
  - type: textarea
    id: validation
    attributes:
      label: What needs validation / 待验证内容
