<rect width="1100" height="700" fill="#f3f3ed"/>
<text x="45" y="55" class="title">IF08 / CONTACTS + TWO SHIELDED CAMERA PORTS</text>
<text x="45" y="84" class="note">Layout proposal · manual tool change · unpowered fit first</text>
<g transform="translate(330,350)">
<circle r="220" fill="#273943"/><circle r="190" fill="#84949c"/><circle r="135" fill="#17252d"/>
<circle r="190" class="line" stroke-dasharray="4 6"/><circle r="180" class="line" stroke-dasharray="4 6"/>
