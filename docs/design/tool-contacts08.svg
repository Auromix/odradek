<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
<defs><style>text{font-family:Arial,sans-serif;fill:#24323a}.title{font-size:25px;font-weight:bold}.note{font-size:15px}.small{font-size:12px}.line{stroke:#84919a;stroke-width:1;fill:none}</style></defs>
<rect width="1400" height="700" fill="#f3f3ed"/>
<text x="45" y="55" class="title">IF08 / 触点供电与控制 + 双路相机同轴口</text>
<text x="45" y="84" class="note">布局提案 · 手动拆换 · 先断电试配</text>
<g transform="translate(330,350)">
<circle r="220" fill="#273943"/><circle r="190" fill="#84949c"/><circle r="135" fill="#17252d"/>
<circle r="190" class="line" stroke-dasharray="4 6"/><circle r="180" class="line" stroke-dasharray="4 6"/>
<g fill="#ecede7" stroke="#182832" stroke-width="3"><circle cx="127.28" cy="127.28" r="11.25"/><circle cx="-127.28" cy="127.28" r="11.25"/><circle cx="127.28" cy="-127.28" r="11.25"/><circle cx="-127.28" cy="-127.28" r="11.25"/></g>
<circle cx="0" cy="-155" r="7.5" fill="#d6b876"/>
<rect x="-60" y="-80" width="120" height="70" rx="6" fill="#31454c" stroke="#9aaab1"/>
<g fill="#e4b44a" stroke="#805c21"><circle cx="-40" cy="-60" r="7.5"/><circle cx="-20" cy="-60" r="7.5"/><circle cx="0" cy="-60" r="7.5"/><circle cx="20" cy="-60" r="7.5"/><circle cx="40" cy="-60" r="7.5"/><circle cx="-40" cy="-30" r="7.5"/><circle cx="-20" cy="-30" r="7.5"/><circle cx="0" cy="-30" r="7.5"/><circle cx="20" cy="-30" r="7.5"/><circle cx="40" cy="-30" r="7.5"/></g>
<g fill="#090f15" stroke="#748b99" stroke-width="3"><rect x="-74" y="31" width="58" height="58" rx="7"/><rect x="16" y="31" width="58" height="58" rx="7"/></g>
<g fill="#334d5b" stroke="#ba9a61" stroke-width="2"><circle cx="-45" cy="60" r="13"/><circle cx="45" cy="60" r="13"/></g>
<path d="M0,-80 V-112 H245 M74,60 H245 M155,128 H245 M0,-155 H245" fill="none" stroke="#83969d" stroke-width="1.5"/>
<text x="252" y="-149" class="small">唯一方向定位销</text>
<text x="252" y="-106" class="small">十触点 / 列间距 4 mm</text>
<text x="252" y="65" class="small">两路 GMSL2 屏蔽同轴口</text>
<text x="252" y="134" class="small">4 × M4 / PCD72 / 起始 45°</text>
<path d="M-135,240 H135 M-135,230 V250 M135,230 V250" class="line"/>
<text x="-96" y="269" class="note">Ø54 中央接口空间</text>
</g>
<g transform="translate(900,155)">
<text class="title">三种功能，各自承担</text>
<text y="42" class="note">1. 法兰、定位销、螺钉：定位与承载</text>
<text y="72" class="note">2. 触点：供电、CAN、识别、在位检测</text>
<text y="102" class="note">3. 同轴口：屏蔽与 GMSL2 视频</text>
<text y="159" class="note">臂侧：后退的平面镀金接触板</text>
<text y="189" class="note">工具侧：可更换弹簧针板</text>
<text y="219" class="note">试样弹簧针自由 / 工作高度：5 / 4 mm</text>
<text y="249" class="note">机械定位面控制压缩止挡</text>
<text y="306" class="note">首版同轴手动插接，不设自动盲插</text>
<text y="336" class="note">保留 J7 转角限制</text>
<text y="366" class="note">工具电压与峰值电流尚待冻结</text>
<text y="396" class="note">默认断电拆换</text>
</g>
<text x="45" y="665" class="small">名义布局草案。实际 PCB、连接器编码、压缩力、插拔空间与公差需要新 CAD 和实物验证；尚未装入当前臂身模型。</text>
</svg>
