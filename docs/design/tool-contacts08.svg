<circle cx="0" cy="-155" r="7.5" fill="#d6b876"/>
<rect x="-60" y="-80" width="120" height="70" rx="6" fill="#31454c" stroke="#9aaab1"/>
<g fill="#e4b44a" stroke="#805c21"><circle cx="-40" cy="-60" r="7.5"/><circle cx="-20" cy="-60" r="7.5"/><circle cx="0" cy="-60" r="7.5"/><circle cx="20" cy="-60" r="7.5"/><circle cx="40" cy="-60" r="7.5"/><circle cx="-40" cy="-30" r="7.5"/><circle cx="-20" cy="-30" r="7.5"/><circle cx="0" cy="-30" r="7.5"/><circle cx="20" cy="-30" r="7.5"/><circle cx="40" cy="-30" r="7.5"/></g>
<g fill="#090f15" stroke="#748b99" stroke-width="3"><rect x="-74" y="31" width="58" height="58" rx="7"/><rect x="16" y="31" width="58" height="58" rx="7"/></g>
<g fill="#334d5b" stroke="#ba9a61" stroke-width="2"><circle cx="-45" cy="60" r="13"/><circle cx="45" cy="60" r="13"/></g>
<path d="M0,-80 V-112 H245 M74,60 H245 M155,128 H245 M0,-155 H245" fill="none" stroke="#83969d" stroke-width="1.5"/>
<text x="252" y="-149" class="small">Unique clock key</text>
<text x="252" y="-106" class="small">10 contacts / 4 mm column pitch</text>
<text x="252" y="65" class="small">Two GMSL2 coax ports</text>
<text x="252" y="134" class="small">4 × M4 / PCD72 / 45° start</text>
<path d="M-135,240 H135 M-135,230 V250 M135,230 V250" class="line"/>
<text x="-96" y="269" class="note">Ø54 central space</text>
</g>
<g transform="translate(680,155)">
<text class="title">Separate the three jobs</text>
<text y="42" class="note">1. Pilot + screws: locate and carry load</text>
<text y="72" class="note">2. Contacts: power, CAN, ID, presence</text>
<text y="102" class="note">3. Coax: shielding and GMSL2 video</text>
<text y="159" class="note">Arm side: recessed flat contact pads</text>
<text y="189" class="note">Tool side: replaceable spring-pin board</text>
<text y="219" class="note">Pin free / working height: 5 / 4 mm</text>
<text y="249" class="note">Hard stop comes from the pilot faces</text>
<text y="306" class="note">No automatic coax blind mating</text>
<text y="336" class="note">No unlimited J7 roll</text>
<text y="366" class="note">Voltage / tool current remain to be frozen</text>
<text y="396" class="note">Default: power off before changing tool</text>
</g>
<text x="45" y="665" class="small">Nominal planning layout only. Actual PCB, connector code, compression force, insertion access and tolerances require new CAD + physical verification.</text>
</svg>
