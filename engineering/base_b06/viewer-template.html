<body>
<header><div><h1>ODRADEK <span id="revision">/ B06 底座</span></h1><small id="moduleScope">紧凑一体盾形 · 斜肩与四瓣浅脊 · 内藏固定</small></div><span class="badge" id="reviewStatus">数字装配审阅 · 实物试装待验证</span></header>
<main>
<aside>
<p class="section-label">ASSEMBLY / 装配状态</p>
<div class="controls"><div class="buttons" id="assemblyModes"><button id="assembled" data-mode="assembled" class="active">总装</button><button id="shellOpen" data-mode="shell">外罩拆开</button><button id="rearOpen" data-mode="rear">后盖拆开</button><button id="exploded" data-mode="exploded">爆炸视图</button></div><div><div class="range-label"><span>拆开程度</span><span id="eValue">0%</span></div><input id="explode" aria-label="拆开程度" type="range" min="0" max="100" value="0"></div><label id="thicknessControl">桌厚 <select id="thickness"><option value="15">15 mm</option><option value="30" selected>30 mm</option><option value="60">60 mm</option></select></label></div>
<p class="section-label">MODULES / 模块显示</p><div class="controls" id="groups"></div>
<p class="section-label">PARTS / 零件与尺寸</p><input class="part-search" id="partSearch" type="search" placeholder="筛选零件名称 / 编号" aria-label="筛选零件"><div class="partlist" id="parts"></div><section class="detail" id="detail" aria-live="polite">选择零件可查看尺寸、工艺和当前状态。<p class="notes">拖动旋转 · 滚轮缩放<br>按住 Shift 拖动或右键拖动平移</p></section><div class="links" id="downloads"></div><p class="status" id="status"></p>
</aside>
<div class="stage"><canvas id="view" aria-label="可旋转的 Odradek 底座三维装配模型"></canvas><div class="view-buttons"><button id="front">前侧</button><button id="back">后侧接口</button><button id="top">俯视</button><button id="under">底面固定</button><button id="fit">适配视野</button></div><div class="overlay"><strong id="modeLabel">总装</strong> · 坐标单位 mm<br>+Y 向桌内 · Z = 0 为桌面<br>拆开视图用于识别装配关系；未包含完整承载桌夹；未模拟拆装路径与柔性线缆。</div><div id="error" role="alert"></div></div>
</main>
<script>
/* Placeholders are replaced by viewer.py. Do not open this template as a model. */
const parts=__ASSEMBLY_DATA__;
const meta=__ASSEMBLY_META__;
(()=>{
const $=selector=>document.querySelector(selector),canvas=$('#view');
if(meta.exterior_only){$('#modeLabel').textContent='外壳合拢';$('#moduleScope').textContent='八件式外罩 · 一体骨架 · 可拆后盖';$('#assembled').textContent='外壳合拢';$('#back').textContent='后侧';$('#under').textContent='外壳下方';canvas.setAttribute('aria-label','可旋转的 Odradek 底座外壳模型')}
const fail=error=>{$('#error').className='error';$('#error').textContent='三维预览未能载入：'+error.message+'。模型文件仍可从交付目录打开。';console.error(error)};
try{
const gl=canvas.getContext('webgl',{antialias:true,alpha:false});if(!gl)throw Error('当前浏览器不支持 WebGL');
const vs=`attribute vec3 p;attribute vec3 n;uniform mat4 vp;uniform vec3 offset;uniform vec3 stretch;varying vec3 normal;void main(){normal=n;gl_Position=vp*vec4(p*stretch+offset,1.0);}`;
const fs=`precision mediump float;uniform vec3 color;uniform float selected;varying vec3 normal;void main(){vec3 nn=normalize(normal);float light=0.38+0.42*max(dot(nn,normalize(vec3(0.3,0.4,1.0))),0.0)+0.20*max(dot(nn,normalize(vec3(-0.5,-0.6,0.3))),0.0);vec3 c=mix(color,vec3(0.96,0.67,0.29),selected*0.32);gl_FragColor=vec4(c*light,1.0);}`;
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const atP=gl.getAttribLocation(program,'p'),atN=gl.getAttribLocation(program,'n'),uVP=gl.getUniformLocation(program,'vp'),uColor=gl.getUniformLocation(program,'color'),uOffset=gl.getUniformLocation(program,'offset'),uStretch=gl.getUniformLocation(program,'stretch'),uSelected=gl.getUniformLocation(program,'selected');
function decode(text){const raw=atob(text),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new Float32Array(bytes.buffer)}
function buffer(values){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,values,gl.STATIC_DRAW);return b}
for(const part of parts){const vertices=decode(part.v);part.vb=buffer(vertices);part.nb=buffer(decode(part.n));part.count=vertices.length/3;delete part.v;delete part.n}
const visible={},defaultHidden=['environment','guide','routing'];let selected='',mode='assembled',explosion=0,thickness=30,yaw=.95,pitch=.45,distance=.7,target=[0,.1,0];
const add=(a,b)=>a.map((v,i)=>v+b[i]),sub=(a,b)=>a.map((v,i)=>v-b[i]),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{const length=Math.hypot(...a)||1;return a.map(v=>v/length)};
for(const key of [...new Set(parts.map(p=>p.group_key))]){visible[key]=!defaultHidden.includes(key);const label=document.createElement('label'),checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=visible[key];checkbox.dataset.group=key;checkbox.onchange=()=>{visible[key]=checkbox.checked;draw()};label.append(checkbox,document.createTextNode(parts.find(p=>p.group_key===key).group));$('#groups').append(label)}
function translation(part){const d=[0,0,0],id=part.id;if(id.includes('PRESSPAD')||id.includes('LOWPAD')||id.includes('FOOT-CAGE')||id.startsWith('HW-THRUST')||id.startsWith('HW-M3-CAGE')||id.startsWith('GUIDE-AF6'))d[2]-=(thickness-30)*.001;const shouldMove=mode==='exploded'||mode==='shell'&&['cover','rear_lid'].includes(part.role)||mode==='rear'&&part.role==='rear_lid';return shouldMove?add(d,part.explode_mm.map(v=>v*explosion*.00001)):d}
function multiply(a,b){const c=new Float32Array(16);for(let j=0;j<4;j++)for(let i=0;i<4;i++)for(let k=0;k<4;k++)c[j*4+i]+=a[k*4+i]*b[j*4+k];return c}
function camera(){const eye=add(target,[distance*Math.cos(pitch)*Math.cos(yaw),distance*Math.cos(pitch)*Math.sin(yaw),distance*Math.sin(pitch)]),z=norm(sub(eye,target)),x=norm(cross([0,0,1],z)),y=cross(z,x);const view=new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]);const aspect=canvas.width/canvas.height,f=Math.min(1,aspect/.95)/Math.tan(.43),near=.001,far=20;const projection=new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0]);return multiply(projection,view)}
function draw(){const ratio=Math.min(window.devicePixelRatio||1,2),width=Math.max(1,Math.round(canvas.clientWidth*ratio)),height=Math.max(1,Math.round(canvas.clientHeight*ratio));if(width!==canvas.width||height!==canvas.height){canvas.width=width;canvas.height=height}gl.viewport(0,0,width,height);gl.clearColor(.065,.09,.115,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);gl.uniformMatrix4fv(uVP,false,camera());for(const part of parts){if(!visible[part.group_key])continue;gl.uniform3fv(uOffset,translation(part));gl.uniform3fv(uStretch,part.id==='ENV-DESK'?[1,1,thickness/30]:[1,1,1]);gl.uniform3fv(uColor,part.color.slice(0,3).map(v=>Math.min(1,v*1.38+.04)));gl.uniform1f(uSelected,part.id===selected?1:0);gl.bindBuffer(gl.ARRAY_BUFFER,part.vb);gl.vertexAttribPointer(atP,3,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(atP);gl.bindBuffer(gl.ARRAY_BUFFER,part.nb);gl.vertexAttribPointer(atN,3,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(atN);gl.drawArrays(gl.TRIANGLES,0,part.count)}}
function fit(){let lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];for(const p of parts){if(!visible[p.group_key]||['environment','guide','routing'].includes(p.group_key))continue;const t=translation(p);for(let i=0;i<3;i++){lo[i]=Math.min(lo[i],p.bbox.min[i]*.001+t[i]);hi[i]=Math.max(hi[i],p.bbox.max[i]*.001+t[i])}}if(!Number.isFinite(lo[0])){lo=meta.bounds.min.map(v=>v*.001);hi=meta.bounds.max.map(v=>v*.001)}target=lo.map((v,i)=>(v+hi[i])/2);const z=[Math.cos(pitch)*Math.cos(yaw),Math.cos(pitch)*Math.sin(yaw),Math.sin(pitch)],x=norm(cross([0,0,1],z)),y=cross(z,x),aspect=Math.max(.1,canvas.clientWidth/canvas.clientHeight),tanV=Math.tan(.43)/Math.min(1,aspect/.95),tanH=tanV*aspect;distance=.12;for(let mask=0;mask<8;mask++){const corner=lo.map((v,i)=>((mask>>i)&1?hi[i]:v)-target[i]),depth=dot(corner,z);distance=Math.max(distance,Math.abs(dot(corner,x))/(tanH*.82)+depth,Math.abs(dot(corner,y))/(tanV*.82)+depth)}draw()}
function sync(){for(const checkbox of document.querySelectorAll('[data-group]'))checkbox.checked=!!visible[checkbox.dataset.group];$('#explode').value=explosion;$('#eValue').textContent=explosion+'%';for(const button of document.querySelectorAll('[data-mode]'))button.classList.toggle('active',button.dataset.mode===mode);$('#modeLabel').textContent={assembled:meta.exterior_only?'外壳合拢':'总装',shell:'外罩拆开',rear:'后盖拆开',exploded:'爆炸视图'}[mode];draw()}
function setMode(next){mode=next;explosion=next==='assembled'?0:100;if(next==='assembled'){for(const key in visible)visible[key]=!defaultHidden.includes(key);selected='';yaw=.95;pitch=.45}else if(next==='rear'){visible.rear_lid=true;visible.interface=true;yaw=-1.7;pitch=.3}else if(next==='shell'){visible.cover=true;visible.rear_lid=true;yaw=.95;pitch=.7}sync();fit()}
for(const button of document.querySelectorAll('[data-mode]'))button.onclick=()=>setMode(button.dataset.mode);
$('#explode').oninput=event=>{explosion=+event.target.value;if(mode==='assembled'&&explosion>0)mode='exploded';sync()};$('#thickness').onchange=event=>{thickness=+event.target.value;draw()};if(!parts.some(p=>p.id==='ENV-DESK'))$('#thicknessControl').hidden=true;
$('#front').onclick=()=>{yaw=.95;pitch=.4;fit()};$('#back').onclick=()=>{yaw=-1.7;pitch=.32;fit()};$('#top').onclick=()=>{yaw=Math.PI/2;pitch=1.56;fit()};$('#under').onclick=()=>{yaw=.9;pitch=-.5;visible.environment=false;visible.guide=parts.some(p=>p.group_key==='guide');sync();fit()};$('#fit').onclick=fit;
function showPart(part){selected=part.id;visible[part.group_key]=true;target=part.bbox.min.map((v,i)=>(v+part.bbox.max[i])*.0005+translation(part)[i]);distance=Math.max(.09,Math.hypot(...part.bbox.size)*.0018);const detail=$('#detail');detail.replaceChildren();const title=document.createElement('p');title.className='detail-title';title.textContent=part.name||part.id;detail.append(title);if(part.name){const id=document.createElement('small');id.textContent=part.id;detail.append(id)}const dimensions=document.createElement('div');dimensions.className='dimensions';part.bbox.size.forEach((value,i)=>{const cell=document.createElement('div');cell.className='dimension';const label=document.createElement('span');label.textContent=['X 宽','Y 深','Z 高'][i];cell.append(label,document.createTextNode(value.toFixed(1)+' mm'));dimensions.append(cell)});detail.append(dimensions);const process=document.createElement('div');process.textContent=[part.material,part.process].filter(Boolean).join(' · ');detail.append(process);const status=document.createElement('p');status.className='part-status';status.textContent=part.prototype_status;detail.append(status);const notes=document.createElement('p');notes.className='notes';notes.textContent=part.notes.join('\n');detail.append(notes);const link=document.createElement('a');link.href=part.stl;link.download='';link.textContent='下载此件 STL';detail.append(link);for(const button of $('#parts').children)button.setAttribute('aria-pressed',String(button.dataset.part===selected));sync()}
const listed=parts.filter(p=>!['environment','guide','routing'].includes(p.group_key));for(const part of listed){const button=document.createElement('button');button.dataset.part=part.id;button.dataset.search=(part.id+' '+part.name+' '+part.group).toLowerCase();button.setAttribute('aria-pressed','false');const name=document.createElement('span');name.className='part-name';name.textContent=part.name||part.id;button.append(name);if(part.name){const id=document.createElement('span');id.className='part-id';id.textContent=part.id;button.append(id)}button.onclick=()=>showPart(part);$('#parts').append(button)}$('#partSearch').oninput=event=>{const query=event.target.value.trim().toLowerCase();for(const button of $('#parts').children)button.hidden=!button.dataset.search.includes(query)};
for(const file of meta.files){const link=document.createElement('a');link.href=file.path;link.download='';link.textContent=file.name;$('#downloads').append(link)}
let pointer=null;canvas.onpointerdown=event=>{pointer={x:event.clientX,y:event.clientY,pan:event.shiftKey||event.button===2};canvas.setPointerCapture(event.pointerId)};canvas.onpointermove=event=>{if(!pointer)return;const dx=event.clientX-pointer.x,dy=event.clientY-pointer.y;if(pointer.pan){const right=[-Math.sin(yaw),Math.cos(yaw),0];target=add(target,right.map(v=>-v*dx*distance*.0015));target[2]+=dy*distance*.0015}else{yaw-=dx*.007;pitch=Math.max(-1.56,Math.min(1.56,pitch+dy*.007))}pointer.x=event.clientX;pointer.y=event.clientY;draw()};canvas.onpointerup=()=>pointer=null;canvas.onpointercancel=()=>pointer=null;canvas.oncontextmenu=event=>event.preventDefault();canvas.onwheel=event=>{event.preventDefault();distance=Math.max(.04,Math.min(6,distance*Math.exp(event.deltaY*.001)));draw()};window.addEventListener('resize',draw);
$('#revision').textContent='/ '+meta.revision+' 底座';document.title='Odradek · '+meta.revision+' 底座三维审阅';$('#reviewStatus').textContent=meta.review_status;$('#status').textContent=parts.length+' 个可视实体 · 尺寸单位 mm\n模型数据已内嵌，三维查看无需联网。下载链接需与模型目录一起保存。';window.B06={parts,visible,draw,setMode,translation,fit,showPart,get state(){return{mode,explosion,thickness,yaw,pitch,distance,target,selected}}};fit();
}catch(error){fail(error)}
})();
</script>
<script>if(!window.B06&&!document.getElementById('error').textContent){document.getElementById('error').className='template-note';document.getElementById('error').innerHTML='这里是查看器模板，还没有嵌入三维模型。请运行 <code>viewer.py</code> 后，通过本地 HTTP 打开 <code>build/index.html</code>。';}</script>
