<text x="30" y="1272" font-size="14">No external ISET resistor: current is set by MC, CC and DC registers. No per-LED ballast is populated.</text>
<text x="30" y="1298" font-size="14">AGND + exposed pad 41 connect to GND copper. VCAP is decoupled only; never feed it from 3.3 V.</text>
