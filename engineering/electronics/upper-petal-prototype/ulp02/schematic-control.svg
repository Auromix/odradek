<text x="725" y="660" font-size="16">VIO_EN: supply AND enable; all bus pins must follow its rail.</text>
<text x="725" y="686" font-size="13">Do not power off VIO_EN while host or another MISO device drives high.</text>
<text x="725" y="710" font-size="13">This candidate uses one point-to-point SPI bus on the bench.</text>
