  <g id="axes_2">
   <g id="text_14">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25445c" x="599.473759" y="102.948491" transform="rotate(-0 599.473759 102.948491)">CFS4 catalogue</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(599.473759 121.539627)">Ring u = -6 ... -1; center = -3.5</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(599.473759 135.039627)">Front assembly u = -7 ... 0</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(599.473759 148.998221)">Plain stud u = 0 ... 4; thread = 4 ... 8</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25445c" x="599.473759" y="180.459788" transform="rotate(-0 599.473759 180.459788)">Mounting candidate</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(599.473759 199.050924)">Seat bore 4 H6; supported seat diameter &gt;= 7.7</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(599.473759 213.009518)">Nut: 3.2 thick, AF7, corners ~8.1</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(599.473759 226.050924)">Max nut torque 0.777 Nm is a LIMIT, not a target</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(599.473759 239.550924)">Hold head hex; turn nut; locking method TBD</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25445c" x="599.473759" y="257.971085" transform="rotate(-0 599.473759 257.971085)">Root-bearing candidate</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(599.473759 276.932533)">2 x SKF 607/8-2Z, 8 x 19 x 6</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(599.473759 291.030971)">Shaft shoulder diameter 10 ... 11</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(599.473759 303.562221)">Housing shoulder opening &lt;= 17; fillet &lt;= 0.3</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(599.473759 317.062221)">Separate coaxial trunnions; no throughshaft</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25445c" x="599.473759" y="335.482382" transform="rotate(-0 599.473759 335.482382)">Carrier packaging example</text>
   </g>
   <g id="text_21">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(599.473759 354.073518)">Bearings: y = +/-16, span 32</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(599.473759 367.573518)">Follower center y = 32; shoulder y = 28.5</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(599.473759 381.073518)">Stud tip y = 20.5; end-cap limit y = 20</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(599.473759 394.573518)">0.5 nominal axial gap; NOT tolerance clearance</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25445c" x="599.473759" y="412.993679" transform="rotate(-0 599.473759 412.993679)">Not released</text>
   </g>
   <g id="text_23">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(599.473759 431.584814)">Rocker / shaft / pin / end-cap strength, fits, tools,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(599.473759 445.084814)">anti-loosening, lubrication and four-module collisions.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(599.473759 458.584814)">Catalogue facts are NOT a vendor solid model.</text>
   </g>
   <g id="text_24">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle" x="798.33688" y="66.963516" transform="rotate(-0 798.33688 66.963516)">Scope and assembly datums</text>
   </g>
  </g>
