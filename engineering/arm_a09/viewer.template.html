<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Odradek A09 · 本体结构讨论</title>
<style>
:root{--paper:#e8edef;--ink:#263641;--muted:#63747e;--amber:#956223;--panel:#f7f9f9;--line:#c4cfd4}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{height:76px;padding:17px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}h1{font-family:"Avenir Next",sans-serif;font-size:26px;font-weight:500;letter-spacing:.06em;margin:0}header p{font-size:12px;letter-spacing:.1em;margin:6px 0 0;color:var(--muted)}.stamp{font-size:12px;color:var(--amber);border:1px solid #bd9b67;padding:8px 12px;border-radius:4px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;height:calc(100vh - 76px);min-height:650px}.stage{position:relative;overflow:hidden;background:radial-gradient(ellipse at 45% 40%,#f5f8f9,#d4dfe4)}canvas{display:block;width:100%;height:100%;touch-action:none}.legend{position:absolute;left:24px;bottom:24px;font-size:12px;color:var(--muted);line-height:1.9;pointer-events:none}.status{position:absolute;left:24px;top:20px;font-size:12px;padding:8px 12px;background:#f7f9f9df;border-left:3px solid #9eb3bd;max-width:80%;line-height:1.7}.controls{overflow-y:auto;padding:24px 22px;background:var(--panel);border-left:1px solid var(--line)}h2{font-size:13px;letter-spacing:.06em;font-weight:600;margin:0 0 12px}.group{padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line)}button,select{font:inherit;color:var(--ink);background:white;border:1px solid var(--line);border-radius:5px;padding:8px 10px;cursor:pointer}button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:white}button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:3px}.row{display:flex;gap:7px;margin:8px 0}.row button{flex:1;font-size:12px}.spec{margin:10px 0 0;color:var(--muted);font-size:12px;line-height:1.7}.spec strong{font-weight:500;color:var(--ink)}.joint{margin:16px 0}.joint label{display:flex;align-items:baseline;justify-content:space-between;font-size:12px}.joint label b{font-family:"SFMono-Regular",Consolas,monospace;font-size:14px;font-weight:500}.joint span{color:var(--muted)}.joint output{font-family:"SFMono-Regular",Consolas,monospace;color:var(--amber)}input[type=range]{width:100%;accent-color:#8d642f;cursor:pointer;margin:9px 0 0}label.check{display:flex;gap:8px;font-size:12px;margin:12px 0;align-items:center}input[type=checkbox]{accent-color:var(--ink)}.note{font-size:12px;color:var(--muted);line-height:1.8}.failure{position:absolute;inset:20%;font-size:16px;line-height:2;background:var(--panel);padding:20px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:800px){header{padding:12px 16px;height:70px}h1{font-size:20px}.stamp{font-size:10px}.layout{display:flex;flex-direction:column;height:auto;min-height:0}.stage{height:65vh;min-height:400px}.controls{border-left:0;border-top:1px solid var(--line);padding:22px}.joints{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}}
</style></head><body>
<header><div><h1>ODRADEK / A09</h1><p>直管骨架 · 交叉肩部 · 收腰底座</p></div><span class="stamp">结构与外观提案</span></header>
<main class="layout"><section class="stage" aria-label="七轴机械臂三维模型"><canvas aria-label="拖动旋转，滚轮缩放"></canvas><div class="status" id="status" aria-live="polite"></div><div class="legend">拖动旋转 · 滚轮缩放<br>七轴 / 裸臂法兰总外负载目标 3 kg</div></section>
<aside class="controls"><section class="group"><h2>连杆比例</h2><div class="row"><button data-variant="slim" aria-pressed="true">短版 · 611 mm</button><button data-variant="long" aria-pressed="false">长版 · 691 mm</button></div><p class="spec" id="spec"></p></section>
<section class="group"><h2>姿态</h2><div class="row"><button data-pose="idle">低位收拢</button><button data-pose="attention">抬起互动</button><button data-pose="reference">参考伸展</button></div><div class="joints" id="joints"></div></section>
<section class="group"><h2>显示</h2><label class="check"><input id="covers" type="checkbox" checked>可拆护罩</label><label class="check"><input id="base" type="checkbox" checked>底座与桌夹背景</label><label class="check"><input id="axes" type="checkbox">关节轴线</label><div class="row"><button id="front">正面</button><button id="side">侧面</button><button id="reset">恢复视角</button></div></section>
<p class="note">长版用于比例对照，肩部扭矩需求更高。采样发现参考姿态下J2 = −70°、J4 = −155°存在干涉，滑条范围不是已验证工作空间。两版均未冻结端座紧固、关节支承、散热及线束设计。</p><div class="sr" id="flange" aria-live="polite"></div></aside></main>
<script>__THREE__</script><script type="application/json" id="model-data">__MODEL_DATA__</script>
<script>
(()=>{'use strict';const D=JSON.parse(document.getElementById('model-data').textContent),canvas=document.querySelector('canvas'),stage=document.querySelector('.stage'),rad=Math.PI/180;
let renderer;try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true})}catch(e){stage.innerHTML='<div class="failure">此查看器需要WebGL。可直接打开同目录的Blender模型，或查看CAD渲染图。</div>';return}renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.setClearColor(0xdce5e9);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(36,1,.005,10);camera.up.set(0,0,1);scene.add(new THREE.AmbientLight(0xffffff,2));for(const [p,power] of [[[1,.1,2],2],[[-1,1,.8],1.1]]){const l=new THREE.DirectionalLight(0xffffff,power);l.position.set(...p);scene.add(l)}
const root=new THREE.Group();scene.add(root);root.position.set(0,.135,.0346);root.rotation.z=Math.PI/2;const context=new THREE.Group();scene.add(context);let current='slim',frames={},meshes=[],q=[],axisHelpers=[],inputs=[],outputs=[],target=new THREE.Vector3(0,.35,.2),orbit={az:45*rad,el:26*rad,distance:1.35};
function mesh(p,material,parent){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p.vertices.flat().map(v=>v*.001),3));g.setIndex(p.faces.flat());g.computeVertexNormals();const o=new THREE.Mesh(g,material);o.name=p.id;parent.add(o);return o}
function material(color,metal=.3){return new THREE.MeshStandardMaterial({color,metalness:metal,roughness:.55})}const mats={core:material(0x293842),cover:material(0xb4c2c9,.15),motor:material(0x31424d,.65),amber:material(0xbf914e,.6)};
for(const p of D.base){mesh(p,material(new THREE.Color(...p.color.slice(0,3)),.35),context)}
function build(which){for(const o of [...root.children]){o.traverse(x=>{if(x.isMesh)x.geometry.dispose()});root.remove(o)}current=which;const d=D[which];frames={world:root};meshes=[];axisHelpers=[];let parent=root;
for(const j of d.layout.joints){const fixed=new THREE.Group(),rotor=new THREE.Group();fixed.name=j.id+'.fixed';rotor.name=j.id+'.rotor';fixed.position.fromArray(j.offset).multiplyScalar(.001);parent.add(fixed);fixed.add(rotor);frames[fixed.name]=fixed;frames[rotor.name]=rotor;parent=rotor;const a=new THREE.AxesHelper(.06);fixed.add(a);axisHelpers.push(a)}
const flange=new THREE.Object3D();flange.position.fromArray(d.flange_from_J7_mm).multiplyScalar(.001);parent.add(flange);frames.flange=flange;
for(const p of d.parts){const m=p.id.includes('dark-cuff')?mats.core:p.id.startsWith('B7')||p.id.includes('retainer')?mats.amber:p.role==='printed_cover'?mats.cover:['motor_envelope','hardware'].includes(p.role)?mats.motor:mats.core;const o=mesh(p,m,frames[p.frame]);o.userData.role=p.role;meshes.push(o)}
document.getElementById('spec').innerHTML=`上臂轴距 <strong>${d.layout.joints[3].offset[0]} mm</strong> · 前臂轴距 <strong>${d.layout.joints[4].offset[0]} mm</strong><br>3 kg参考伸展：肩部 <strong>${d.shoulder_torque.toFixed(1)} N·m</strong>`;
document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variant===which)));document.getElementById('joints').replaceChildren();inputs=[];outputs=[];
for(const [i,j] of d.layout.joints.entries()){const wrap=document.createElement('div');wrap.className='joint';const label=document.createElement('label');label.htmlFor='joint-'+i;label.innerHTML=`<div><b>${j.id}</b> <span>${j.name}</span></div>`;const value=document.createElement('output');label.append(value);const inp=document.createElement('input');inp.type='range';inp.id='joint-'+i;inp.min=j.limits_deg[0];inp.max=j.limits_deg[1];inp.step=1;inp.setAttribute('aria-label',j.id+' '+j.name);inp.addEventListener('input',()=>{q[i]=Number(inp.value);setAngles()});wrap.append(label,inp);document.getElementById('joints').append(wrap);inputs.push(inp);outputs.push(value)}q=[...d.layout.poses.attention];setAngles();visibility()}
function setAngles(){const d=D[current];for(const [i,j] of d.layout.joints.entries()){const r=frames[j.id+'.rotor'];r.rotation.set(0,0,0);r.rotation[['x','y','z'][j.axis.indexOf(1)]]=(q[i]+j.zero_deg)*rad;inputs[i].value=q[i];outputs[i].textContent=q[i]+'°'}const name=Object.keys(d.layout.poses).find(k=>d.layout.poses[k].every((v,i)=>v===q[i]));document.querySelectorAll('[data-pose]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pose===name)));const blocked=d.known_conflicts.find(c=>c.q.every((v,i)=>v===q[i]));document.getElementById('status').style.borderLeftColor=blocked?'#b54f36':'#9eb3bd';document.getElementById('status').textContent=blocked?'此采样姿态已检出实体干涉 · '+blocked.joint+' '+blocked.angle+'°':name?'此代表姿态：CAD实体未检出相交 · 紧固件/线束尚未完整':'当前拖动姿态未做碰撞检查';render();const p=frames.flange.getWorldPosition(new THREE.Vector3());document.getElementById('flange').textContent='法兰位置毫米 '+p.toArray().map(v=>(v*1000).toFixed(2)).join(', ')}
function visibility(){meshes.forEach(o=>o.visible=o.userData.role!=='printed_cover'||document.getElementById('covers').checked);context.visible=document.getElementById('base').checked;axisHelpers.forEach(o=>o.visible=document.getElementById('axes').checked);render()}
function render(){const ce=Math.cos(orbit.el);camera.position.set(target.x+orbit.distance*ce*Math.cos(orbit.az),target.y+orbit.distance*ce*Math.sin(orbit.az),target.z+orbit.distance*Math.sin(orbit.el));camera.lookAt(target);scene.updateMatrixWorld(true);renderer.render(scene,camera)}
function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();render()}new ResizeObserver(resize).observe(stage);
document.querySelectorAll('[data-pose]').forEach(b=>b.addEventListener('click',()=>{q=[...D[current].layout.poses[b.dataset.pose]];setAngles()}));document.querySelectorAll('[data-variant]').forEach(b=>b.addEventListener('click',()=>build(b.dataset.variant)));for(const id of ['covers','base','axes'])document.getElementById(id).addEventListener('change',visibility);
document.getElementById('front').onclick=()=>{orbit.az=Math.PI/2;orbit.el=.12;render()};document.getElementById('side').onclick=()=>{orbit.az=0;orbit.el=.12;render()};document.getElementById('reset').onclick=()=>{orbit={az:45*rad,el:26*rad,distance:1.35};render()};const pointers=new Map();canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY})});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId),next={x:e.clientX,y:e.clientY};if(pointers.size===1){orbit.az-=(next.x-old.x)*.008;orbit.el=Math.max(-.3,Math.min(1.5,orbit.el+(next.y-old.y)*.006))}else{const other=[...pointers.entries()].find(([id])=>id!==e.pointerId)?.[1];if(other){const a=Math.hypot(old.x-other.x,old.y-other.y),b=Math.hypot(next.x-other.x,next.y-other.y);if(a>5&&b>5)orbit.distance=Math.max(.4,Math.min(4,orbit.distance*a/b))}}pointers.set(e.pointerId,next);render()});for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>pointers.delete(e.pointerId));canvas.addEventListener('wheel',e=>{e.preventDefault();orbit.distance=Math.max(.45,Math.min(4,orbit.distance*Math.exp(e.deltaY*.001)));render()},{passive:false});
window.armA09={getState:()=>({variant:current,angles:[...q],flange:frames.flange.getWorldPosition(new THREE.Vector3()).toArray(),parts:meshes.length}),sourceHashes:{slim:D.slim.sha256,long:D.long.sha256}};build('slim');resize();
})()</script></body></html>
