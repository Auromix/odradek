<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Odradek · B04 三维装配审查</title>
<style>*{box-sizing:border-box}body{margin:0;background:#11171d;color:#dce2e6;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{height:78px;padding:18px 28px;border-bottom:1px solid #35404a;display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;font-weight:550;margin:0 0 5px}small{color:#95a5b1;font-size:12px}main{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 78px)}aside{padding:23px 22px;overflow:auto;border-right:1px solid #35404a;background:#161e25}.caption{color:#dca555;font-size:11px;letter-spacing:2px;margin:0 0 12px}.controls{display:grid;gap:11px;margin-bottom:26px}label{display:flex;gap:9px;align-items:center}input[type=checkbox]{accent-color:#e7af59}input[type=range]{width:100%;accent-color:#e7af59}button,select{border:1px solid #50616c;border-radius:6px;background:#23313b;color:#e1e8ed;padding:8px 10px;cursor:pointer}button:hover{background:#344853}.buttons{display:flex;gap:6px;flex-wrap:wrap}.stage{position:relative;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;bottom:20px;left:25px;background:#121b23dd;border:1px solid #415260;border-radius:8px;padding:12px 16px;font-size:12px;line-height:1.7;pointer-events:none}.tag{background:#b7843a;color:#111820;border-radius:4px;padding:5px 10px;font-size:12px}.info{font-size:12px;line-height:1.7;color:#aab7c0;overflow-wrap:anywhere}a{color:#e8b465;text-decoration:none}.partlist{max-height:240px;overflow:auto;border:1px solid #344651;border-radius:5px}.partlist button{display:block;width:100%;border:0;border-bottom:1px solid #2d3c46;border-radius:0;text-align:left;font-size:10px;background:transparent}.partlist button:hover{background:#344853}.links{display:flex;gap:13px;font-size:12px;margin-top:17px}.status{font-size:11px;color:#849aa9;margin-top:14px}@media(max-width:760px){header{padding:12px;height:88px}header>span{display:none}main{grid-template-columns:205px 1fr;height:calc(100vh - 88px)}aside{padding:14px 12px}.overlay{left:8px;bottom:8px;font-size:10px}h1{font-size:17px}}</style>
<header><div><h1>ODRADEK <span style="color:#dca555;font-weight:350">/ B04 底座</span></h1><small>真实 CAD 衍生模型 · 后沿桌夹 · 内收盒架 · 服务 PCB</small></div><span class="tag">P1 · 原型装配审查</span></header>
<main><aside><p class="caption">ASSEMBLY / 装配</p><div class="controls"><div class="buttons"><button id="home">总装</button><button id="internal">看内部</button><button id="back">后侧</button><button id="side">侧视</button></div><label>桌厚 <select id="thickness"><option value="15">15 mm</option><option value="30" selected>30 mm</option><option value="60">60 mm</option></select></label><div><label>展开程度 <span id="eValue">0%</span></label><input id="explode" aria-label="展开程度" type="range" min="0" max="100" value="0"></div></div><p class="caption">MODULES / 模块显示</p><div id="groups" class="controls"></div><p class="caption">PARTS / 零件</p><div class="partlist" id="parts"></div><div class="info" id="detail">点击零件名称聚焦查看。拖动旋转，滚轮缩放；按住 Shift 拖动平移。</div><div class="links"><a href="ODR-BASE-B04-P1.step">STEP 总装</a><a href="ODR-BASE-B04-P1.blend">Blender</a><a href="ODR-BASE-B04-P1.glb">GLB</a></div><p class="status" id="status"></p></aside><div class="stage"><canvas id="view" aria-label="可旋转的底座三维装配模型"></canvas><div class="overlay">坐标：+Y 向桌内 · Z = 0 为桌面<br>盒体为 180 × 150 × 50 mm 检具；完整柔性线束待深化<br>展开视图示意模块拆分。实体负载、桌板接触与带电测试尚待验证。</div></div></main>
<script>const parts=__ASSEMBLY_DATA__;
const canvas=document.querySelector('#view'),gl=canvas.getContext('webgl',{antialias:true,alpha:false});if(!gl)throw Error('WebGL unavailable');
const vs=`attribute vec3 p;attribute vec3 n;uniform mat4 vp;uniform vec3 offset;uniform vec3 stretch;varying vec3 normal;varying vec3 pos;void main(){vec3 w=p*stretch+offset;normal=n;pos=w;gl_Position=vp*vec4(w,1.0);}`;
const fs=`precision mediump float;uniform vec3 color;varying vec3 normal;varying vec3 pos;void main(){vec3 n=normalize(normal);float a=0.35+0.43*max(dot(n,normalize(vec3(0.3,0.4,1.0))),0.0)+0.22*max(dot(n,normalize(vec3(-0.5,-0.6,0.3))),0.0);gl_FragColor=vec4(color*a,1.0);}`;
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);gl.useProgram(prog);const atP=gl.getAttribLocation(prog,'p'),atN=gl.getAttribLocation(prog,'n'),uvp=gl.getUniformLocation(prog,'vp'),uc=gl.getUniformLocation(prog,'color'),uo=gl.getUniformLocation(prog,'offset'),us=gl.getUniformLocation(prog,'stretch');
function decode(s,Type){const raw=atob(s),u=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)u[i]=raw.charCodeAt(i);return new Type(u.buffer)}
function buf(a,kind){let b=gl.createBuffer();gl.bindBuffer(kind,b);gl.bufferData(kind,a,gl.STATIC_DRAW);return b}
for(const p of parts){const v=decode(p.v,Float32Array);p.vb=buf(v,gl.ARRAY_BUFFER);p.nb=buf(decode(p.n,Float32Array),gl.ARRAY_BUFFER);p.count=v.length/3;p.ib=null;delete p.v;delete p.n;delete p.f;}
const visible={};for(const name of [...new Set(parts.map(p=>p.group))]){visible[name]=!['桌面 / 墙面','拧紧工具示意'].includes(name);const el=document.createElement('label'),ck=document.createElement('input');ck.type='checkbox';ck.checked=visible[name];ck.dataset.group=name;ck.onchange=()=>{visible[name]=ck.checked;draw()};el.append(ck,document.createTextNode(name));document.querySelector('#groups').append(el)}
let yaw=.96,pitch=.42,distance=.72,target=[0,.115,-.045],explosion=0,thickness=30;
const add=(a,b)=>a.map((v,i)=>v+b[i]),sub=(a,b)=>a.map((v,i)=>v-b[i]),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{let l=Math.hypot(...a);return a.map(v=>v/l)};
function mul(a,b){let c=new Float32Array(16);for(let j=0;j<4;j++)for(let i=0;i<4;i++)for(let k=0;k<4;k++)c[j*4+i]+=a[k*4+i]*b[j*4+k];return c}
function matrix(){const eye=add(target,[distance*Math.cos(pitch)*Math.cos(yaw),distance*Math.cos(pitch)*Math.sin(yaw),distance*Math.sin(pitch)]),z=norm(sub(eye,target)),x=norm(cross([0,0,1],z)),y=cross(z,x);const v=new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]);let a=canvas.width/canvas.height,f=Math.min(1,a/.95)/Math.tan(.43),near=.005,far=20;let pr=new Float32Array([f/a,0,0,0,0,f,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0]);return mul(pr,v)}
function translation(p){let d=[0,0,0],id=p.id,e=explosion*.001;if(id.includes('PRESSPAD')||id.includes('LOWPAD')||id.includes('FOOT-CAGE')||id.startsWith('HW-THRUST')||id.startsWith('HW-M3-CAGE')||id.startsWith('GUIDE-AF6'))d[2]-=(thickness-30)*.001;
 if(id.startsWith('B04-301')||id.startsWith('HW-M3-COVER-TOP'))d[2]+=e*1.25;
 else if(id.includes('FLANGE'))d[2]+=e*.6;
 else if(p.group==='盒架 / 盒体检具')d[2]-=e*.55;
 else if(p.group==='PCB / 元件')d[2]+=e*.35;
 return d;}
function draw(){let r=Math.min(window.devicePixelRatio||1,2),w=Math.round(canvas.clientWidth*r),h=Math.round(canvas.clientHeight*r);if(w!==canvas.width||h!==canvas.height){canvas.width=w;canvas.height=h}gl.viewport(0,0,w,h);gl.clearColor(.075,.101,.128,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);gl.uniformMatrix4fv(uvp,false,matrix());for(const p of parts){if(!visible[p.group])continue;gl.uniform3fv(uo,translation(p));gl.uniform3fv(us,p.id==='ENV-DESK'?[1,1,thickness/30]:[1,1,1]);gl.uniform3fv(uc,p.color.slice(0,3).map(v=>Math.min(1,v*1.55+.07)));gl.bindBuffer(gl.ARRAY_BUFFER,p.vb);gl.vertexAttribPointer(atP,3,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(atP);gl.bindBuffer(gl.ARRAY_BUFFER,p.nb);gl.vertexAttribPointer(atN,3,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(atN);gl.drawArrays(gl.TRIANGLES,0,p.count)}}
function sync(){for(const c of document.querySelectorAll('[data-group]'))c.checked=visible[c.dataset.group];draw()}
document.querySelector('#home').onclick=()=>{yaw=.96;pitch=.42;distance=.72;target=[0,.115,-.045];explosion=0;document.querySelector('#explode').value=0;document.querySelector('#eValue').textContent='0%';visible['外罩 / 底座灯']=true;visible['拧紧工具示意']=false;sync()};
document.querySelector('#internal').onclick=()=>{visible['外罩 / 底座灯']=false;visible['桌面 / 墙面']=false;yaw=-1.0;pitch=.65;distance=.55;target=[0,.07,-.02];sync()};document.querySelector('#back').onclick=()=>{yaw=-2.2;pitch=.38;distance=.7;target=[0,.10,-.05];draw()};document.querySelector('#side').onclick=()=>{yaw=0;pitch=.06;distance=.7;target=[0,.11,-.055];draw()};
const tighten=document.createElement('button');tighten.textContent='如何拧紧';tighten.onclick=()=>{visible['拧紧工具示意']=true;visible['桌面 / 墙面']=false;explosion=0;document.querySelector('#explode').value=0;document.querySelector('#eValue').textContent='0%';yaw=.9;pitch=-.5;distance=.69;target=[.025,.105,-.11];document.querySelector('#detail').textContent='从螺杆底端插入 AF6 长内六角扳手，交替小步拧紧两根 M12 螺杆；压脚向上顶住桌底。侧面螺钉只连接框架。此模型不规定未经测力标定的安装扭矩。';sync()};document.querySelector('.buttons').append(tighten);
document.querySelector('#explode').oninput=e=>{explosion=+e.target.value;document.querySelector('#eValue').textContent=explosion+'%';draw()};document.querySelector('#thickness').onchange=e=>{thickness=+e.target.value;draw()};
for(const p of parts.filter(p=>p.category==='custom'||p.id==='ENV-PCB')){let b=document.createElement('button');b.textContent=p.id;b.onclick=()=>{visible[p.group]=true;target=p.bbox.min.map((v,i)=>(v+p.bbox.max[i])*.0005+translation(p)[i]);distance=Math.max(.13,Math.hypot(...p.bbox.size)*.0016);document.querySelector('#detail').textContent=p.id+' · '+p.material+'\n'+p.process+'\n'+p.notes.join(' ');sync()};document.querySelector('#parts').append(b)}
let down=null;canvas.onpointerdown=e=>{down={x:e.clientX,y:e.clientY,shift:e.shiftKey||e.button===2};canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!down)return;let dx=e.clientX-down.x,dy=e.clientY-down.y;if(down.shift){let right=[-Math.sin(yaw),Math.cos(yaw),0];target=add(target,right.map(v=>-v*dx*distance*.0015));target[2]+=dy*distance*.0015}else{yaw-=dx*.007;pitch=Math.max(-1.5,Math.min(1.5,pitch+dy*.007))}down.x=e.clientX;down.y=e.clientY;draw()};canvas.onpointerup=()=>down=null;canvas.onpointercancel=()=>down=null;canvas.oncontextmenu=e=>e.preventDefault();canvas.onwheel=e=>{e.preventDefault();distance=Math.max(.08,Math.min(3,distance*Math.exp(e.deltaY*.001)));draw()};window.addEventListener('resize',draw);document.querySelector('#status').textContent=parts.length+' 个可视实体 · WebGL · 所有资源内嵌，无需联网';window.B04={parts,visible,draw,get state(){return{explosion,thickness,yaw,pitch}}};draw();
</script></html>
