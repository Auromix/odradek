<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="830">
<rect width="1080" height="830" fill="#f8f9f8"/><style>text{font-family:Arial,sans-serif;fill:#233d48;font-size:18px}</style>
<text x="35" y="45" style="font-size:28px;font-weight:bold">J7 axial stack / +X / mm</text>
<text x="35" y="80">Stack schematic only; part geometry comes from the six STEP projections.</text>
<text x="940" y="117">X span mm</text><text x="35" y="159">Motor output</text><text x="940" y="159">25.7..25.7</text><text x="35" y="222">Journal rear stop</text><text x="940" y="222">34.2..36.2</text><text x="35" y="285">Rear bearing</text><text x="940" y="285">36.2..43.2</text><text x="35" y="348">Outer-ring stop</text><text x="940" y="348">43.2..47.2</text><text x="35" y="411">Front bearing</text><text x="940" y="411">47.2..54.2</text><text x="35" y="474">Inner spacer</text><text x="940" y="474">54.2..57.7</text><text x="35" y="537">Front retainer</text><text x="940" y="537">54.2..56.7</text><text x="35" y="600">Detachable flange</text><text x="940" y="600">57.7..65.7</text><rect x="360.5" y="135" width="2" height="38" rx="2" fill="#63727d"/><rect x="488.00000000000006" y="198" width="30.0" height="38" rx="2" fill="#527086"/><rect x="518.0" y="261" width="105.0" height="38" rx="2" fill="#9ca8b2"/><rect x="623.0" y="324" width="60.0" height="38" rx="2" fill="#243b50"/><rect x="683.0" y="387" width="105.0" height="38" rx="2" fill="#9ca8b2"/><rect x="788.0" y="450" width="52.5" height="38" rx="2" fill="#d89b42"/><rect x="788.0" y="513" width="37.5" height="38" rx="2" fill="#243b50"/><rect x="840.5" y="576" width="120.0" height="38" rx="2" fill="#527086"/>
<text x="35" y="695">Assembly: bearings enter opposite housing ends; cartridge enters journal from +X.</text>
<text x="35" y="728">Then fit retainer + inner spacer + detachable flange; output bolts secure the rotor.</text>
<text x="35" y="761">Nominal rotor/retainer gap 1.0; actual endplay and thread bottoming must be measured.</text>
<text x="35" y="794">Supported unpowered plastic fit only; motor housing has no assumed cable through-bore.</text></svg>